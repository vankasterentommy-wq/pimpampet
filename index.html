<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PIM PAM PET — Multiplayer</title>
<style>
:root {
  --bg-1: #0a0118;
  --bg-2: #1a0533;
  --neon-pink: #ff2d95;
  --neon-cyan: #00f0ff;
  --neon-purple: #b537f2;
  --neon-yellow: #fff200;
  --neon-green: #39ff14;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Impact', 'Arial Black', sans-serif;
  background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1));
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(181, 55, 242, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(181, 55, 242, 0.1) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: gridMove 20s linear infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(50px, 50px); }
}
.screen { position: relative; z-index: 1; min-height: 100vh; padding: 20px; display: none; }
.screen.active { display: flex; flex-direction: column; align-items: center; }
#home-screen.active, #host-setup-screen.active, #player-join-screen.active,
#player-lobby-screen.active, #winner-screen.active { justify-content: center; }
#host-game-screen.active, #player-game-screen.active { gap: 18px; }

.title {
  font-size: clamp(3rem, 10vw, 8rem);
  font-weight: 900;
  letter-spacing: 0.05em;
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: titleGlow 3s ease-in-out infinite, gradientShift 4s ease infinite;
  margin-bottom: 10px;
  text-align: center;
}
.title-small {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan);
  letter-spacing: 0.2em;
  margin-bottom: 15px;
}
@keyframes titleGlow {
  0%, 100% { filter: drop-shadow(0 0 20px var(--neon-pink)); }
  50% { filter: drop-shadow(0 0 40px var(--neon-cyan)); }
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.subtitle {
  font-family: 'Courier New', monospace;
  font-size: 1.2rem;
  color: var(--neon-cyan);
  letter-spacing: 0.3em;
  margin-bottom: 40px;
  text-shadow: 0 0 10px var(--neon-cyan);
}
.hint {
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.1em;
  margin-bottom: 20px;
  text-align: center;
  max-width: 90vw;
}

.setup-card {
  background: rgba(26, 5, 51, 0.6);
  backdrop-filter: blur(10px);
  border: 2px solid var(--neon-purple);
  border-radius: 20px;
  padding: 30px;
  width: min(600px, 92vw);
  box-shadow: 0 0 40px rgba(181, 55, 242, 0.4);
}
.input-label {
  display: block;
  font-size: 0.85rem;
  color: var(--neon-cyan);
  letter-spacing: 0.2em;
  margin: 15px 0 8px 0;
}
input[type="text"], input[type="number"] {
  width: 100%;
  background: rgba(0, 0, 0, 0.5);
  border: 2px solid var(--neon-cyan);
  border-radius: 10px;
  padding: 15px;
  color: white;
  font-size: 1.2rem;
  font-family: inherit;
  outline: none;
  transition: all 0.2s;
}
input:focus { border-color: var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink); }
.code-input {
  text-align: center;
  font-size: 2.5rem !important;
  letter-spacing: 0.5em;
  font-weight: 900;
  color: var(--neon-yellow) !important;
  text-transform: uppercase;
}

.btn {
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  border: none;
  border-radius: 10px;
  padding: 15px 30px;
  color: white;
  font-size: 1.2rem;
  font-family: inherit;
  font-weight: bold;
  letter-spacing: 0.1em;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  box-shadow: 0 0 20px rgba(255, 45, 149, 0.5);
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 30px rgba(255, 45, 149, 0.8); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-cyan { background: linear-gradient(135deg, var(--neon-cyan), #0099cc); box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }
.btn-green { background: linear-gradient(135deg, var(--neon-green), #2ecc71); box-shadow: 0 0 20px rgba(57, 255, 20, 0.5); color: #000; }
.btn-yellow { background: linear-gradient(135deg, var(--neon-yellow), #f39c12); box-shadow: 0 0 20px rgba(255, 242, 0, 0.5); color: #000; }
.btn-pink { background: linear-gradient(135deg, var(--neon-pink), #c70066); box-shadow: 0 0 20px rgba(255, 45, 149, 0.5); }
.btn-big { font-size: 2rem; padding: 25px 50px; border-radius: 15px; width: 100%; margin-top: 15px; }

/* HOME SCREEN */
.mode-buttons {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn-mode {
  width: 240px;
  height: 280px;
  border-radius: 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
}
.mode-icon { font-size: 5rem; }
.mode-label { font-size: 1.8rem; font-weight: 900; }
.mode-sub { font-size: 0.85rem; opacity: 0.85; letter-spacing: 0.1em; }

/* HOST SETUP */
.room-code-display {
  font-size: clamp(4rem, 14vw, 9rem);
  font-weight: 900;
  letter-spacing: 0.15em;
  color: var(--neon-yellow);
  text-shadow:
    0 0 20px var(--neon-yellow),
    0 0 40px var(--neon-yellow),
    0 0 60px var(--neon-pink);
  margin: 10px 0 5px 0;
  text-align: center;
}
.settings { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 15px 0; }
@media (min-width: 500px) { .settings { grid-template-columns: 1fr 1fr 1fr; } }
.setting label { display: block; font-size: 0.85rem; color: var(--neon-cyan); margin-bottom: 5px; letter-spacing: 0.1em; }

.lobby-section { margin: 20px 0; }
.lobby-label {
  font-size: 0.85rem;
  color: var(--neon-cyan);
  letter-spacing: 0.2em;
  margin-bottom: 10px;
  text-align: center;
}
.player-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  min-height: 60px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
}
.player-list:empty::before {
  content: 'Waiting for players to join...';
  color: rgba(255, 255, 255, 0.4);
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  align-self: center;
  margin: auto;
}
.player-chip {
  background: rgba(0, 240, 255, 0.15);
  border: 2px solid var(--neon-cyan);
  border-radius: 50px;
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.05rem;
  animation: chipIn 0.3s ease;
}
@keyframes chipIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.player-chip .avatar { font-size: 1.4rem; }

/* AVATAR GRID */
.avatar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.avatar-btn {
  background: rgba(0, 0, 0, 0.4);
  border: 2px solid rgba(0, 240, 255, 0.3);
  border-radius: 12px;
  font-size: 1.8rem;
  padding: 8px;
  cursor: pointer;
  transition: all 0.2s;
  aspect-ratio: 1;
}
.avatar-btn:hover { border-color: var(--neon-cyan); }
.avatar-btn.selected {
  border-color: var(--neon-pink);
  background: rgba(255, 45, 149, 0.2);
  box-shadow: 0 0 15px var(--neon-pink);
  transform: scale(1.1);
}
.error-msg {
  color: var(--neon-pink);
  text-align: center;
  margin-top: 10px;
  min-height: 1.2em;
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
}

/* PLAYER LOBBY */
.big-avatar { font-size: clamp(5rem, 18vw, 10rem); animation: avatarFloat 2s ease infinite alternate; }
@keyframes avatarFloat { from { transform: translateY(0); } to { transform: translateY(-15px); } }
.big-name {
  font-size: clamp(2rem, 6vw, 3.5rem);
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan);
  margin: 10px 0 20px 0;
}

/* HOST GAME SCREEN */
.round-bar {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 10px 20px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--neon-cyan);
  border-radius: 50px;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.15em;
  font-size: 0.85rem;
  flex-wrap: wrap;
  justify-content: center;
}
.round-bar .room-code-mini { color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); }
.round-bar .round-num { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
.round-bar .round-target { color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }
.round-bar .end-game-btn {
  background: transparent;
  border: 1px solid var(--neon-pink);
  color: var(--neon-pink);
  padding: 4px 12px;
  border-radius: 50px;
  font-family: inherit;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.2s;
}
.round-bar .end-game-btn:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }

.scoreboard {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 15px 20px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 15px;
  border: 1px solid var(--neon-purple);
  width: auto;
  max-width: 95vw;
}
.score-card {
  background: rgba(26, 5, 51, 0.8);
  border: 2px solid var(--neon-cyan);
  border-radius: 15px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 180px;
  transition: all 0.3s;
  position: relative;
}
.score-card.leader { border-color: var(--neon-yellow); box-shadow: 0 0 20px var(--neon-yellow); }
.score-card.score-pop { animation: scorePop 0.6s ease; }
@keyframes scorePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); box-shadow: 0 0 50px var(--neon-green); }
  100% { transform: scale(1); }
}
.score-card .avatar { font-size: 2rem; }
.score-card .info { flex: 1; }
.score-card .name { font-size: 1rem; font-weight: bold; }
.score-card .points { font-size: 1.5rem; color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); }
.score-card .streak {
  position: absolute;
  top: -10px;
  right: -10px;
  background: linear-gradient(135deg, #ff0000, #ff9500);
  border-radius: 50px;
  padding: 4px 10px;
  font-size: 0.85rem;
  font-weight: bold;
  display: none;
  animation: fireGlow 0.8s ease infinite alternate;
}
.score-card .streak.show { display: block; }
@keyframes fireGlow {
  from { box-shadow: 0 0 10px #ff5500; }
  to { box-shadow: 0 0 25px #ffaa00; }
}

.game-main { display: flex; flex-direction: column; align-items: center; gap: 18px; flex: 1; }

.wheel-container { position: relative; width: min(320px, 65vw); height: min(320px, 65vw); }
.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    var(--neon-pink), var(--neon-purple), var(--neon-cyan),
    var(--neon-green), var(--neon-yellow), var(--neon-pink)
  );
  position: relative;
  box-shadow: 0 0 60px rgba(255, 45, 149, 0.6), inset 0 0 60px rgba(0, 0, 0, 0.5);
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.16, 0.99);
}
.wheel-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70%;
  height: 70%;
  border-radius: 50%;
  background: radial-gradient(circle, #1a0533, #0a0118);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 4px solid white;
  box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.2);
  z-index: 5;
}
.letter-display {
  font-size: clamp(5rem, 16vw, 11rem);
  font-weight: 900;
  font-family: 'Arial Black', 'Impact', sans-serif;
  color: #fff;
  text-shadow:
    0 0 10px #fff,
    0 0 20px var(--neon-cyan),
    0 0 40px var(--neon-cyan),
    0 0 60px var(--neon-pink),
    0 0 80px var(--neon-pink);
  line-height: 1;
}
.wheel-pointer {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 25px solid transparent;
  border-right: 25px solid transparent;
  border-top: 40px solid var(--neon-yellow);
  filter: drop-shadow(0 0 10px var(--neon-yellow));
  z-index: 10;
}
.category-card {
  background: linear-gradient(135deg, rgba(255, 45, 149, 0.2), rgba(0, 240, 255, 0.2));
  backdrop-filter: blur(10px);
  border: 3px solid var(--neon-cyan);
  border-radius: 20px;
  padding: 25px 40px;
  text-align: center;
  min-width: min(500px, 90vw);
  box-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
  animation: cardFlip 0.6s ease;
}
@keyframes cardFlip {
  from { transform: rotateX(90deg); opacity: 0; }
  to { transform: rotateX(0); opacity: 1; }
}
.category-label {
  font-size: 0.9rem;
  color: var(--neon-cyan);
  letter-spacing: 0.3em;
  margin-bottom: 10px;
}
.category-text {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  color: white;
  text-shadow: 0 0 20px var(--neon-pink);
}
.timer-ring { position: relative; width: 120px; height: 120px; }
.timer-ring svg { transform: rotate(-90deg); }
.timer-ring circle { fill: none; stroke-width: 10; }
.timer-ring .bg { stroke: rgba(255, 255, 255, 0.1); }
.timer-ring .progress {
  stroke: var(--neon-green);
  stroke-linecap: round;
  transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
  filter: drop-shadow(0 0 10px currentColor);
}
.timer-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  font-weight: bold;
}
.action-buttons { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 95vw; }
.bonus-badge {
  display: inline-block;
  background: var(--neon-yellow);
  color: #000;
  padding: 4px 10px;
  border-radius: 50px;
  font-size: 0.8rem;
  margin-left: 10px;
  font-weight: bold;
  animation: badgePulse 1s ease infinite;
}
@keyframes badgePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* HOST BUZZED DISPLAY */
.buzzed-display {
  text-align: center;
  background: rgba(255, 45, 149, 0.1);
  border: 3px solid var(--neon-pink);
  border-radius: 20px;
  padding: 25px 40px;
  box-shadow: 0 0 40px rgba(255, 45, 149, 0.6);
  animation: buzzedIn 0.4s ease;
}
@keyframes buzzedIn {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.buzzed-avatar { font-size: 4rem; }
.buzzed-name {
  font-size: 2.5rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--neon-yellow), var(--neon-pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin: 5px 0;
}
.buzzed-label {
  font-size: 1rem;
  color: var(--neon-cyan);
  letter-spacing: 0.2em;
  margin-bottom: 10px;
}
.answer-timer {
  font-size: 4rem;
  font-weight: 900;
  color: var(--neon-yellow);
  text-shadow: 0 0 30px var(--neon-yellow);
  animation: pulse 1s ease infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* PLAYER GAME SCREEN */
.player-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--neon-cyan);
  border-radius: 50px;
  width: auto;
}
.player-mini-avatar { font-size: 1.8rem; }
.player-mini-name {
  font-size: 1.1rem;
  color: white;
  font-weight: bold;
}
.player-mini-score {
  color: var(--neon-yellow);
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  text-shadow: 0 0 8px var(--neon-yellow);
}
.player-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 100%;
  max-width: 500px;
}

.player-status {
  text-align: center;
  padding: 30px;
}
.status-icon { font-size: 5rem; margin-bottom: 10px; animation: pulse 2s ease infinite; }
.status-text {
  font-size: 2rem;
  font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan);
  letter-spacing: 0.1em;
}
.status-sub {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 8px;
  font-family: 'Courier New', monospace;
}

/* REVEAL & BUZZER (player) */
.reveal-info {
  text-align: center;
  margin-bottom: 10px;
}
.reveal-letter {
  font-size: clamp(4rem, 18vw, 7rem);
  font-weight: 900;
  font-family: 'Arial Black', sans-serif;
  color: #fff;
  text-shadow:
    0 0 10px #fff,
    0 0 20px var(--neon-cyan),
    0 0 40px var(--neon-pink);
  line-height: 1;
}
.reveal-category {
  font-size: clamp(1.2rem, 5vw, 1.8rem);
  color: var(--neon-cyan);
  text-shadow: 0 0 15px var(--neon-cyan);
  padding: 10px 20px;
  border: 2px solid var(--neon-cyan);
  border-radius: 50px;
  background: rgba(0, 240, 255, 0.1);
  margin-top: 8px;
}

.buzzer-btn {
  width: min(280px, 75vw);
  height: min(280px, 75vw);
  border-radius: 50%;
  border: 8px solid #fff;
  background: radial-gradient(circle at 30% 30%, #ff5fa3, var(--neon-pink), #c70066);
  color: #fff;
  font-family: inherit;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    0 0 60px rgba(255, 45, 149, 0.8),
    inset 0 -15px 30px rgba(0, 0, 0, 0.4),
    inset 0 15px 30px rgba(255, 255, 255, 0.3);
  transition: all 0.1s;
  animation: buzzerPulse 1.5s ease infinite;
}
@keyframes buzzerPulse {
  0%, 100% { box-shadow: 0 0 60px rgba(255, 45, 149, 0.8), inset 0 -15px 30px rgba(0, 0, 0, 0.4), inset 0 15px 30px rgba(255, 255, 255, 0.3); }
  50% { box-shadow: 0 0 100px rgba(255, 45, 149, 1), inset 0 -15px 30px rgba(0, 0, 0, 0.4), inset 0 15px 30px rgba(255, 255, 255, 0.4); }
}
.buzzer-btn:active {
  transform: scale(0.92);
  animation: none;
}
.buzzer-text {
  font-size: clamp(2.5rem, 10vw, 4rem);
  letter-spacing: 0.05em;
  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}
.buzzer-btn.locked {
  background: radial-gradient(circle at 30% 30%, #555, #333, #111);
  border-color: #666;
  cursor: not-allowed;
  animation: none;
  box-shadow: none;
}
.buzzer-hint {
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.1em;
  text-align: center;
}

/* PLAYER YOU'RE UP */
.youre-up {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, rgba(255, 242, 0, 0.15), rgba(255, 45, 149, 0.15));
  border: 4px solid var(--neon-yellow);
  border-radius: 25px;
  box-shadow: 0 0 60px rgba(255, 242, 0, 0.6);
  animation: buzzedIn 0.4s ease;
}
.youre-up-icon { font-size: 4rem; margin-bottom: 5px; }
.youre-up-text {
  font-size: clamp(2.5rem, 9vw, 4rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--neon-yellow), var(--neon-pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: titleGlow 1s ease infinite;
}
.youre-up-sub {

<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ServerValue = firebase.database.ServerValue;

// ============================================================
// CATEGORIES

const CATEGORIES = [
  "Boy name", "Girl name", "Singer", "Actor", "Famous person",

  "Filipino actor", "Filipino singer", "Tagalog word",
];
const LETTERS = "ABCDEFGHIJKLMNOPRSTUW".split("");

const AVATARS = ["🦊","🐼","🦁","🐯","🐸","🐙","🦄","🐲","🦖","🐺","🦅","🦉","🐧","🐨","🐵","🦝","🐰","🐹","🐶","🐱"];

};

// ============================================================

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genRoomCode() {
  const chars = "BCDFGHJKLMNPRSTVWXZ";
  let code = "";
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function genId() {
  return 'p' + Date.now() + Math.floor(Math.random() * 100000);
}
function flashScreen() {
  const f = document.getElementById('flash');
  f.classList.remove('active');
  void f.offsetWidth;
  f.classList.add('active');
}

// ============================================================
// AUDIO
// ============================================================
let audioCtx;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type='sine', volume=0.15) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
const soundTick = () => playTone(800, 0.05, 'square', 0.08);
const soundDing = () => { playTone(880, 0.15, 'sine', 0.2); setTimeout(() => playTone(1320, 0.3, 'sine', 0.2), 100); };
const soundScore = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.12, 'square', 0.18), i * 80));
const soundBuzzer = () => playTone(150, 0.3, 'sawtooth', 0.2);
const soundBuzzPress = () => { playTone(1200, 0.08, 'square', 0.25); setTimeout(() => playTone(1800, 0.08, 'square', 0.25), 60); };
const soundWinner = () => [523, 659, 784, 1047, 1319, 1568].forEach((n, i) => setTimeout(() => playTone(n, 0.2, 'square', 0.2), i * 120));

document.body.addEventListener('click', initAudio, { capture: true });
document.body.addEventListener('touchstart', initAudio, { capture: true });

// ============================================================
// CONFETTI
// ============================================================
const confettiCanvas = document.getElementById('confetti-canvas');
const cctx = confettiCanvas.getContext('2d');
let confettiParticles = [];
function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const confettiColors = ['#ff2d95', '#00f0ff', '#b537f2', '#fff200', '#39ff14'];
function fireConfetti() {
  for (let i = 0; i < 100; i++) {
    confettiParticles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * 22,
      vy: (Math.random() - 0.5) * 22 - 6,
      size: Math.random() * 8 + 4,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rotation: Math.random() * 360,
      vr: (Math.random() - 0.5) * 20,
      life: 1,
    });
  }
}
function updateConfetti() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiParticles = confettiParticles.filter(p => p.life > 0);
  confettiParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.5;
    p.rotation += p.vr;
    p.life -= 0.012;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rotation * Math.PI / 180);
    cctx.globalAlpha = p.life;
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    cctx.restore();
  });
  requestAnimationFrame(updateConfetti);
}
updateConfetti();

// ============================================================
// HOME SCREEN
// ============================================================
document.getElementById('host-mode-btn').addEventListener('click', () => {
  local.role = 'host';
  startHosting();
});
document.getElementById('join-mode-btn').addEventListener('click', () => {
  local.role = 'player';
  showJoinScreen();
});

// Auto-route to join if URL has ?room=XXXX
window.addEventListener('load', () => {
  const urlParams = new URLSearchParams(location.search);
  const roomFromUrl = urlParams.get('room');
  if (roomFromUrl) {
    local.role = 'player';
    showJoinScreen();
    document.getElementById('join-code-input').value = roomFromUrl.toUpperCase();
  }
});

// ============================================================
// HOST FLOW
// ============================================================
async function startHosting() {
  local.roomCode = genRoomCode();
  local.myId = 'host_' + Date.now();

  await db.ref(`rooms/${local.roomCode}`).set({
    state: 'lobby',
    targetScore: 1000,
    roundTime: 30,
    answerTime: 5,
    round: 0,
    currentLetter: null,
    currentCategory: null,
    isRareLetter: false,
    roundStartTime: null,
    buzzedPlayer: null,
    hostId: local.myId,
    createdAt: ServerValue.TIMESTAMP,
  });

  // Auto-cleanup if host disconnects (after a delay so refresh doesn't kill the room)
  // Skipping auto-cleanup for v1 — host can manually end via button.

  document.getElementById('room-code-display').textContent = local.roomCode;
  showScreen('host-setup-screen');

  // Listen for player joins in the setup lobby
  db.ref(`rooms/${local.roomCode}/players`).on('value', snap => {
    const players = snap.val() || {};
    renderHostLobby(players);
    const count = Object.keys(players).length;
    document.getElementById('host-start-btn').disabled = count < 2;
  });
}

function renderHostLobby(players) {
  document.getElementById('lobby-players').innerHTML = Object.values(players).map(p => `
    <div class="player-chip">
      <span class="avatar">${p.avatar}</span>
      <span>${escapeHtml(p.name)}</span>
    </div>
  `).join('');
}

document.getElementById('host-start-btn').addEventListener('click', async () => {
  const targetScore = parseInt(document.getElementById('target-score').value) || 1000;
  const roundTime = parseInt(document.getElementById('round-time').value) || 30;
  const answerTime = parseInt(document.getElementById('answer-time').value) || 5;

  await db.ref(`rooms/${local.roomCode}`).update({
    state: 'ready',
    targetScore,
    roundTime,
    answerTime,
    round: 0,
  });

  document.getElementById('host-room-display').textContent = local.roomCode;
  document.getElementById('round-target').textContent = targetScore;
  showScreen('host-game-screen');
  hostListenToRoom();
  showHostReadyToSpin();
});

function hostListenToRoom() {
  // Stop the lobby-only listener, start the full room listener
  db.ref(`rooms/${local.roomCode}/players`).off();

  db.ref(`rooms/${local.roomCode}`).on('value', snap => {
    const room = snap.val();
    if (!room) return;
    local.cachedRoom = room;
    renderHostScoreboard(room.players || {});
    document.getElementById('round-num').textContent = room.round || 1;

    // React to a buzz: only fires when buzzedPlayer transitions from null → playerId AND state is still revealing
    if (room.buzzedPlayer && room.buzzedPlayer !== local.prevBuzzedPlayer && room.state === 'revealing') {
      local.prevBuzzedPlayer = room.buzzedPlayer;
      handleBuzzReceived(room);
    } else {
      local.prevBuzzedPlayer = room.buzzedPlayer;
    }

    // Winner detection
    if (room.state === 'winner' && !local.shownWinner) {
      const winner = Object.values(room.players || {}).find(p => (p.score || 0) >= room.targetScore);
      if (winner) showWinnerScreen(winner);
    }
  });
}

function renderHostScoreboard(players) {
  const list = Object.values(players);
  if (list.length === 0) return;
  const maxScore = Math.max(...list.map(p => p.score || 0));
  document.getElementById('scoreboard').innerHTML = list.map(p => `
    <div class="score-card ${(p.score || 0) === maxScore && maxScore > 0 ? 'leader' : ''}" data-id="${p.id}">
      <span class="avatar">${p.avatar}</span>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="points">${p.score || 0}</div>
      </div>
      <span class="streak ${(p.streak || 0) >= 3 ? 'show' : ''}">🔥 ${p.streak || 0}</span>
    </div>
  `).join('');
}

function showHostReadyToSpin() {
  document.getElementById('letter-display').textContent = '?';
  document.getElementById('category-area').innerHTML = '';
  document.getElementById('timer-ring').style.display = 'none';
  document.getElementById('action-buttons').innerHTML = '<button class="btn btn-yellow btn-big" id="spin-btn" style="max-width:400px;">🎰 SPIN</button>';
  document.getElementById('spin-btn').addEventListener('click', hostSpin);
}

async function hostSpin() {
  const useRare = Math.random() < 0.15;
  const pool = useRare ? RARE_LETTERS : LETTERS;
  const letter = pool[Math.floor(Math.random() * pool.length)];
  const category = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
  const newRound = (local.cachedRoom.round || 0) + 1;

  document.getElementById('spin-btn').disabled = true;
  local.wheelRotation += 360 * (5 + Math.random() * 3);
  document.getElementById('wheel').style.transform = `rotate(${local.wheelRotation}deg)`;
  document.getElementById('action-buttons').innerHTML = '<div style="color:var(--neon-cyan); font-size:1.1rem; letter-spacing:0.15em;">🎰 SPINNING...</div>';

  // Tell players we're spinning
  await db.ref(`rooms/${local.roomCode}`).update({
    state: 'spinning',
    buzzedPlayer: null,
    wrongBuzzers: null,
    round: newRound,
  });
  local.prevBuzzedPlayer = null;

  let ticks = 0;
  const tickInt = setInterval(() => { soundTick(); if (++ticks > 25) clearInterval(tickInt); }, 150);

  await new Promise(r => setTimeout(r, 4000));
  clearInterval(tickInt);
  soundDing();
  flashScreen();

  document.getElementById('letter-display').textContent = letter;

  // Reset scoredThisRound for all players
  const updates = {
    state: 'revealing',
    currentLetter: letter,
    currentCategory: category,
    isRareLetter: useRare,
    roundStartTime: ServerValue.TIMESTAMP,
  };
  Object.keys(local.cachedRoom.players || {}).forEach(id => {
    updates[`players/${id}/scoredThisRound`] = false;
  });
  await db.ref(`rooms/${local.roomCode}`).update(updates);

  showHostRevealing(letter, category, useRare);
  hostStartTimer();
}

function showHostRevealing(letter, category, isRare) {
  document.getElementById('category-area').innerHTML = `
    <div class="category-card">
      <div class="category-label">CATEGORY</div>
      <div class="category-text">${escapeHtml(category)}${isRare ? '<span class="bonus-badge">2× RARE!</span>' : ''}</div>
    </div>
  `;
  document.getElementById('action-buttons').innerHTML = `
    <div style="text-align:center; color:var(--neon-cyan); font-size:1.2rem; letter-spacing:0.15em; padding:20px;">⏳ WAITING FOR BUZZ...</div>
  `;
}

function hostStartTimer(resumeFromElapsed = 0) {
  const duration = local.cachedRoom.roundTime || 30;
  const startedAt = Date.now() - (resumeFromElapsed * 1000);
  document.getElementById('timer-ring').style.display = 'block';

  if (local.hostTimerInterval) clearInterval(local.hostTimerInterval);
  local.hostTimerInterval = setInterval(() => {
    const elapsed = (Date.now() - startedAt) / 1000;
    const remaining = Math.max(0, duration - elapsed);
    updateTimerRing(remaining, duration);
    if (remaining <= 0) {
      clearInterval(local.hostTimerInterval);
      hostTimesUp();
    }
  }, 100);
}

function updateTimerRing(remaining, total) {
  document.getElementById('timer-text').textContent = Math.ceil(remaining);
  const c = 2 * Math.PI * 52;
  const ratio = remaining / total;
  const prog = document.getElementById('timer-progress');
  prog.style.strokeDashoffset = c * (1 - ratio);
  if (ratio > 0.5) prog.style.stroke = 'var(--neon-green)';
  else if (ratio > 0.25) prog.style.stroke = 'var(--neon-yellow)';
  else prog.style.stroke = 'var(--neon-pink)';
}

async function hostTimesUp() {
  if (local.cachedRoom.buzzedPlayer) return;
  soundBuzzer();

  const updates = { state: 'roundEnd' };
  Object.entries(local.cachedRoom.players || {}).forEach(([id, p]) => {
    if (!p.scoredThisRound) updates[`players/${id}/streak`] = 0;
  });
  await db.ref(`rooms/${local.roomCode}`).update(updates);

  document.getElementById('action-buttons').innerHTML = `
    <div style="text-align:center;">
      <div style="font-size:1.6rem; color:var(--neon-pink); margin-bottom:15px;">⏰ TIME'S UP — nobody buzzed!</div>
      <button class="btn btn-cyan btn-big" id="next-btn" style="max-width:300px;">NEXT ROUND →</button>
    </div>
  `;
  document.getElementById('next-btn').addEventListener('click', hostNextRound);
}

async function handleBuzzReceived(room) {
  // Pause main timer
  if (local.hostTimerInterval) clearInterval(local.hostTimerInterval);

  // Move state to 'buzzed'
  await db.ref(`rooms/${local.roomCode}/state`).set('buzzed');

  showHostBuzzed(room);
}

function showHostBuzzed(room) {
  const buzzedId = room.buzzedPlayer;
  const player = (room.players || {})[buzzedId];
  if (!player) return;

  soundBuzzer();
  document.getElementById('action-buttons').innerHTML = `
    <div class="buzzed-display">
      <div class="buzzed-avatar">${player.avatar}</div>
      <div class="buzzed-name">${escapeHtml(player.name)}</div>
      <div class="buzzed-label">⏱️ ${room.answerTime || 5} SECONDS TO ANSWER</div>
      <div class="answer-timer" id="answer-timer">${room.answerTime || 5}</div>
      <div style="display:flex; gap:15px; margin-top:20px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-green" id="judge-correct" style="font-size:1.3rem; padding:18px 30px;">✅ CORRECT</button>
        <button class="btn btn-pink" id="judge-wrong" style="font-size:1.3rem; padding:18px 30px;">❌ WRONG</button>
      </div>
    </div>
  `;
  document.getElementById('judge-correct').addEventListener('click', () => hostJudge(true));
  document.getElementById('judge-wrong').addEventListener('click', () => hostJudge(false));

  // Answer timer countdown
  let answerLeft = room.answerTime || 5;
  if (local.hostAnswerInterval) clearInterval(local.hostAnswerInterval);
  local.hostAnswerInterval = setInterval(() => {
    answerLeft--;
    const el = document.getElementById('answer-timer');
    if (el) el.textContent = Math.max(0, answerLeft);
    if (answerLeft <= 0) {
      clearInterval(local.hostAnswerInterval);
      hostJudge(false); // auto-wrong on timeout
    }
  }, 1000);
}

async function hostJudge(correct) {
  if (local.hostAnswerInterval) clearInterval(local.hostAnswerInterval);
  const room = local.cachedRoom;
  const buzzedId = room.buzzedPlayer;
  const player = (room.players || {})[buzzedId];
  if (!player) return;

  if (correct) {
    // === AWARD POINTS ===
    const elapsed = (Date.now() - room.roundStartTime) / 1000;
    let points = 100;
    let breakdown = ['+100 base'];
    if (elapsed < 3) { points += 100; breakdown.push('+100 LIGHTNING'); }
    else if (elapsed < 6) { points += 50; breakdown.push('+50 fast'); }
    if (room.isRareLetter) { points *= 2; breakdown.push('×2 rare letter'); }

    const newStreak = (player.streak || 0) + 1;
    if (newStreak >= 5) { points *= 3; breakdown.push('×3 ON FIRE'); }
    else if (newStreak >= 3) { points *= 2; breakdown.push('×2 streak'); }

    const newScore = (player.score || 0) + points;
    const updates = {};
    updates[`players/${buzzedId}/score`] = newScore;
    updates[`players/${buzzedId}/streak`] = newStreak;
    updates[`players/${buzzedId}/scoredThisRound`] = true;
    Object.keys(room.players || {}).forEach(id => {
      if (id !== buzzedId) updates[`players/${id}/streak`] = 0;
    });
    updates['state'] = newScore >= room.targetScore ? 'winner' : 'roundEnd';
    updates['lastWinner'] = { id: buzzedId, points: points, name: player.name, avatar: player.avatar };

    await db.ref(`rooms/${local.roomCode}`).update(updates);

    soundScore();
    fireConfetti();
    flashScreen();

    document.getElementById('action-buttons').innerHTML = `
      <div style="text-align:center;">
        <div style="font-size:2.5rem; color:var(--neon-yellow); text-shadow:0 0 30px var(--neon-yellow); margin-bottom:5px;">+${points} POINTS!</div>
        <div style="font-size:1rem; color:var(--neon-cyan); margin-bottom:8px;">${player.avatar} ${escapeHtml(player.name)}</div>
        <div style="font-size:0.85rem; color:rgba(255,255,255,0.7); margin-bottom:20px; letter-spacing:0.1em;">${breakdown.join(' • ')}</div>
        <button class="btn btn-cyan btn-big" id="next-btn" style="max-width:300px;">NEXT ROUND →</button>
      </div>
    `;
    document.getElementById('next-btn').addEventListener('click', hostNextRound);
  } else {
    // === WRONG ANSWER ===
    soundBuzzer();
    const updates = {};
    updates[`players/${buzzedId}/streak`] = 0;
    updates['buzzedPlayer'] = null;
    updates[`wrongBuzzers/${buzzedId}`] = true;

    // Check remaining time
    const elapsed = (Date.now() - room.roundStartTime) / 1000;
    const remaining = (room.roundTime || 30) - elapsed;

    if (remaining > 1) {
      // Resume revealing state, others can buzz
      updates['state'] = 'revealing';
      await db.ref(`rooms/${local.roomCode}`).update(updates);
      local.prevBuzzedPlayer = null;
      showHostRevealing(room.currentLetter, room.currentCategory, room.isRareLetter);
      hostStartTimer(elapsed);
    } else {
      // Time's basically up, end the round
      updates['state'] = 'roundEnd';
      Object.keys(room.players || {}).forEach(id => {
        if (id !== buzzedId) updates[`players/${id}/streak`] = (room.players[id].streak || 0); // keep existing
      });
      await db.ref(`rooms/${local.roomCode}`).update(updates);
      local.prevBuzzedPlayer = null;
      document.getElementById('action-buttons').innerHTML = `
        <div style="text-align:center;">
          <div style="font-size:1.6rem; color:var(--neon-pink); margin-bottom:15px;">❌ Wrong + time's up</div>
          <button class="btn btn-cyan btn-big" id="next-btn" style="max-width:300px;">NEXT ROUND →</button>
        </div>
      `;
      document.getElementById('next-btn').addEventListener('click', hostNextRound);
    }
  }
}

async function hostNextRound() {
  const room = local.cachedRoom;
  const winner = Object.values(room.players || {}).find(p => (p.score || 0) >= room.targetScore);
  if (winner) {
    await db.ref(`rooms/${local.roomCode}/state`).set('winner');
    showWinnerScreen(winner);
    return;
  }

  await db.ref(`rooms/${local.roomCode}`).update({
    state: 'ready',
    currentLetter: null,
    currentCategory: null,
    buzzedPlayer: null,
    wrongBuzzers: null,
    roundStartTime: null,
    isRareLetter: false,
  });
  local.prevBuzzedPlayer = null;
  showHostReadyToSpin();
}

document.getElementById('end-game-btn').addEventListener('click', async () => {
  if (confirm('End the game and return to home?')) {
    if (local.roomCode && local.role === 'host') {
      try { await db.ref(`rooms/${local.roomCode}`).remove(); } catch(e) {}
    }
    location.reload();
  }
});

// ============================================================
// PLAYER FLOW
// ============================================================
function showJoinScreen() {
  showScreen('player-join-screen');
  // Render avatar grid
  const grid = document.getElementById('avatar-grid');
  grid.innerHTML = AVATARS.map(a => `<button class="avatar-btn" data-avatar="${a}">${a}</button>`).join('');
  grid.querySelectorAll('.avatar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      local.selectedAvatar = btn.dataset.avatar;
    });
  });
  // Pre-select random
  const randIdx = Math.floor(Math.random() * AVATARS.length);
  grid.querySelectorAll('.avatar-btn')[randIdx].classList.add('selected');
  local.selectedAvatar = AVATARS[randIdx];
}

document.getElementById('join-submit-btn').addEventListener('click', joinRoom);
document.getElementById('join-code-input').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase();
});

async function joinRoom() {
  const code = document.getElementById('join-code-input').value.trim().toUpperCase();
  const name = document.getElementById('join-name-input').value.trim();

  if (!code || code.length !== 4) return showJoinError('Please enter a 4-letter room code');
  if (!name) return showJoinError('Please enter your name');
  if (!local.selectedAvatar) return showJoinError('Pick an avatar');

  const snap = await db.ref(`rooms/${code}`).once('value');
  if (!snap.exists()) return showJoinError(`Room ${code} doesn't exist`);

  local.roomCode = code;
  local.myId = genId();
  local.myName = name;
  local.myAvatar = local.selectedAvatar;

  await db.ref(`rooms/${code}/players/${local.myId}`).set({
    id: local.myId,
    name,
    avatar: local.selectedAvatar,
    score: 0,
    streak: 0,
    scoredThisRound: false,
    connected: true,
  });

  // Mark as disconnected if browser closes
  db.ref(`rooms/${code}/players/${local.myId}/connected`).onDisconnect().set(false);

  document.getElementById('player-header-avatar').textContent = local.selectedAvatar;
  document.getElementById('player-header-name').textContent = name;
  document.getElementById('my-avatar').textContent = local.selectedAvatar;
  document.getElementById('my-name').textContent = name;

  showScreen('player-lobby-screen');
  playerListenToRoom();
}

function showJoinError(msg) {
  document.getElementById('join-error').textContent = msg;
  setTimeout(() => { document.getElementById('join-error').textContent = ''; }, 3000);
}

function playerListenToRoom() {
  db.ref(`rooms/${local.roomCode}`).on('value', snap => {
    const room = snap.val();
    if (!room) {
      alert('The host ended the game');
      location.reload();
      return;
    }
    local.cachedRoom = room;
    handlePlayerStateChange(room);
  });
}

function handlePlayerStateChange(room) {
  const me = (room.players || {})[local.myId];
  if (me) {
    document.getElementById('player-header-score').textContent = me.score || 0;
  }

  if (room.state === 'lobby') {
    showScreen('player-lobby-screen');
    renderPlayerLobbyList(room.players || {});
  } else if (room.state === 'ready' || room.state === 'roundEnd') {
    showScreen('player-game-screen');
    renderPlayerWaiting(room);
  } else if (room.state === 'spinning') {
    showScreen('player-game-screen');
    renderPlayerSpinning(room);
  } else if (room.state === 'revealing') {
    showScreen('player-game-screen');
    renderPlayerBuzzer(room);
  } else if (room.state === 'buzzed') {
    showScreen('player-game-screen');
    renderPlayerBuzzed(room);
  } else if (room.state === 'winner') {
    if (!local.shownWinner) {
      const winner = Object.values(room.players || {}).find(p => (p.score || 0) >= room.targetScore);
      if (winner) showWinnerScreen(winner);
    }
  }
}

function renderPlayerLobbyList(players) {
  document.getElementById('player-lobby-players').innerHTML = Object.values(players).map(p => `
    <div class="player-chip">
      <span class="avatar">${p.avatar}</span>
      <span>${escapeHtml(p.name)}</span>
    </div>
  `).join('');
}

function renderPlayerWaiting(room) {
  const lastWinner = room.lastWinner;
  let lastWinnerHtml = '';
  if (room.state === 'roundEnd' && lastWinner) {
    lastWinnerHtml = `
      <div class="status-icon">${lastWinner.avatar}</div>
      <div class="status-text">+${lastWinner.points}</div>
      <div class="status-sub">${escapeHtml(lastWinner.name)} won the round</div>
    `;
  } else {
    lastWinnerHtml = `
      <div class="status-icon">⏳</div>
      <div class="status-text">GET READY</div>
      <div class="status-sub">Round ${room.round || 1} — Host is preparing the next spin...</div>
    `;
  }
  document.getElementById('player-main').innerHTML = `
    <div class="player-status">${lastWinnerHtml}</div>
    ${renderMiniScoreboard(room)}
  `;
}

function renderPlayerSpinning(room) {
  document.getElementById('player-main').innerHTML = `
    <div class="player-status">
      <div class="status-icon" style="animation: titleGlow 0.5s ease infinite;">🎰</div>
      <div class="status-text">SPINNING...</div>
      <div class="status-sub">Get your finger ready!</div>
    </div>
    ${renderMiniScoreboard(room)}
  `;
}

function renderPlayerBuzzer(room) {
  const wrongBuzzers = room.wrongBuzzers || {};
  const iAmLocked = !!wrongBuzzers[local.myId];

  const buzzerHtml = iAmLocked
    ? `
      <button class="buzzer-btn locked" disabled>
        <span class="buzzer-text">❌</span>
      </button>
      <div class="buzzer-hint">You guessed wrong this round</div>
    `
    : `
      <button class="buzzer-btn" id="buzzer-btn">
        <span class="buzzer-text">BUZZ!</span>
      </button>
      <div class="buzzer-hint">Tap when you know the answer</div>
    `;

  document.getElementById('player-main').innerHTML = `
    <div class="reveal-info">
      <div class="reveal-letter">${room.currentLetter || '?'}</div>
      <div class="reveal-category">${escapeHtml(room.currentCategory)}${room.isRareLetter ? '<span class="bonus-badge">2×</span>' : ''}</div>
    </div>
    ${buzzerHtml}
  `;

  if (!iAmLocked) {
    document.getElementById('buzzer-btn').addEventListener('click', playerBuzz);
  }
}

async function playerBuzz() {
  initAudio();
  soundBuzzPress();
  if (navigator.vibrate) navigator.vibrate(80);

  // Optimistic lock the local button to prevent double-tap
  const btn = document.getElementById('buzzer-btn');
  if (btn) btn.disabled = true;

  const buzzerRef = db.ref(`rooms/${local.roomCode}/buzzedPlayer`);
  try {
    const result = await buzzerRef.transaction(current => {
      if (current !== null && current !== undefined) return; // abort
      return local.myId;
    });
    if (!result.committed || result.snapshot.val() !== local.myId) {
      // Lost the race
      if (btn) {
        btn.disabled = false;
        btn.classList.add('locked');
        btn.querySelector('.buzzer-text').textContent = 'TOO SLOW';
      }
    }
    // If we won, the listener will fire and renderPlayerBuzzed will show "YOU'RE UP!"
  } catch (e) {
    if (btn) btn.disabled = false;
  }
}

function renderPlayerBuzzed(room) {
  const buzzedId = room.buzzedPlayer;
  const buzzed = (room.players || {})[buzzedId];
  if (!buzzed) return;

  if (buzzedId === local.myId) {
    document.getElementById('player-main').innerHTML = `
      <div class="youre-up">
        <div class="youre-up-icon">🎯</div>
        <div class="youre-up-text">YOU'RE UP!</div>
        <div class="youre-up-sub">SHOUT YOUR ANSWER</div>
        <div class="youre-up-letter">${room.currentLetter}</div>
        <div class="youre-up-category">${escapeHtml(room.currentCategory)}</div>
      </div>
    `;
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
  } else {
    document.getElementById('player-main').innerHTML = `
      <div class="other-buzzed">
        <div class="other-avatar">${buzzed.avatar}</div>
        <div class="other-name">${escapeHtml(buzzed.name)} buzzed!</div>
        <div class="other-sub">Waiting for their answer...</div>
      </div>
      ${renderMiniScoreboard(room)}
    `;
  }
}

function renderMiniScoreboard(room) {
  const players = Object.values(room.players || {}).sort((a, b) => (b.score || 0) - (a.score || 0));
  return `
    <div class="mini-scoreboard">
      ${players.map(p => `
        <div class="mini-row ${p.id === local.myId ? 'me' : ''}">
          <span>${p.avatar} ${escapeHtml(p.name)}${(p.streak || 0) >= 3 ? ' 🔥' + p.streak : ''}</span>
          <span style="color:var(--neon-yellow)">${p.score || 0}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// ============================================================
// SHARED — WINNER
// ============================================================
function showWinnerScreen(winner) {
  if (local.shownWinner) return;
  local.shownWinner = true;
  document.getElementById('winner-avatar').textContent = winner.avatar;
  document.getElementById('winner-name').textContent = winner.name;
  document.getElementById('winner-score').textContent = (winner.score || 0) + ' PTS';
  showScreen('winner-screen');
  soundWinner();
  const burst = setInterval(fireConfetti, 600);
  setTimeout(() => clearInterval(burst), 6000);
}

document.getElementById('play-again-btn').addEventListener('click', async () => {
  if (local.roomCode && local.role === 'host') {
    try { await db.ref(`rooms/${local.roomCode}`).remove(); } catch(e) {}
  }
  location.reload();
});
</script>
